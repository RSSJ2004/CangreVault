name: CI
on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar PostgreSQL 16 (binarios)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-16 >/dev/null
      - name: Migraciones + pruebas SQL (RLS, reglas contables)
        run: PGBIN=/usr/lib/postgresql/16/bin bash scripts/test-db.sh

  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/normalize-simple-entry/index.ts supabase/functions/financial-advisor/index.ts
